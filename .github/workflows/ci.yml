name: Sky's Terrain Smoother CI

on:
  push:
    branches:
      - 'master-*'
      - 'feature/**'
  pull_request:
    branches:
      - 'master-*'

permissions:
  contents: read

concurrency:
  group: skysterrainsmoother-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold-forge-bootstrap:
    name: Cold Forge bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Java 8 compilation toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'

      - name: Install pinned Java 25 Gradle runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'

      - name: Pin production Java for the dependency builds
        run: |
          echo "SGS_JAVA25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "SBP_JAVA25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "STS_JAVA25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Read pinned dependency sources
        id: content
        run: |
          set -euo pipefail
          grass="$(sed -n 's/^grass.commit=//p' gradle/content-dependencies.properties)"
          [[ "$grass" =~ ^[0-9a-f]{40}$ ]]
          echo "grass=$grass" >> "$GITHUB_OUTPUT"
          pieces="$(sed -n 's/^pieces.commit=//p' gradle/content-dependencies.properties)"
          [[ "$pieces" =~ ^[0-9a-f]{40}$ ]]
          echo "pieces=$pieces" >> "$GITHUB_OUTPUT"
      - name: Check out SkysGrassSlabs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SkyBlade1978/SkysGrassSlabs
          ref: ${{ steps.content.outputs.grass }}
          path: dependencies/grass
      - name: Check out SkysBuildingPieces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SkyBlade1978/SkysBuildingPieces
          ref: ${{ steps.content.outputs.pieces }}
          path: dependencies/pieces
      - name: Build development dependencies
        run: |
          set -euo pipefail
          (cd dependencies/grass && bash ./gradlew assemble --no-daemon --stacktrace)
          (cd dependencies/pieces && bash ./gradlew assemble --no-daemon --stacktrace)


      - name: Bootstrap Forge from an empty cache
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/skysterrainsmoother-cold-gradle
        run: |
          set -euo pipefail
          test ! -e .gradle
          test ! -e "$GRADLE_USER_HOME"
          mkdir -p "$GRADLE_USER_HOME"
          chmod +x ./gradlew
          gradle_args=(
            classes test -PgrassSlabsDirectory=dependencies/grass -PbuildingPiecesDirectory=dependencies/pieces
            --no-daemon --no-build-cache --stacktrace --max-workers=2
            -Dorg.gradle.java.installations.paths="$JAVA_HOME,$JAVA_HOME_21_X64,$JAVA_HOME_8_X64,$JAVA_HOME_25_X64"
            -Dorg.gradle.java.installations.auto-detect=false
            -Dorg.gradle.java.installations.auto-download=false
          )
          ./gradlew "${gradle_args[@]}"

      - name: Verify same-cache bootstrap offline
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/skysterrainsmoother-cold-gradle
          ORESPAWN_MAVENIZER_OFFLINE: "true"
        run: |
          set -euo pipefail
          gradle_args=(
            classes test -PgrassSlabsDirectory=dependencies/grass -PbuildingPiecesDirectory=dependencies/pieces
            --rerun-tasks --offline --no-daemon --no-build-cache --stacktrace --max-workers=2
            -Dorg.gradle.java.installations.paths="$JAVA_HOME,$JAVA_HOME_21_X64,$JAVA_HOME_8_X64,$JAVA_HOME_25_X64"
            -Dorg.gradle.java.installations.auto-detect=false
            -Dorg.gradle.java.installations.auto-download=false
          )
          ./gradlew "${gradle_args[@]}"

  build:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read target build metadata
        id: target
        shell: bash
        run: |
          set -euo pipefail
          value() { sed -n "s/^$1=//p" gradle.properties; }
          toolchain="$(value java_toolchain_version)"
          selector="$(value java_setup_version)"
          echo "java_setup_version=${selector:-$toolchain}" >> "$GITHUB_OUTPUT"
          echo "java_version=$(value java_version)" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$(value minecraft_version)" >> "$GITHUB_OUTPUT"
          echo "gradle_java_version=${selector:-$(value gradle_java_toolchain_version)}" >> "$GITHUB_OUTPUT"
          echo "artifact_prefix=SkysTerrainSmoother-$(value mod_version)" >> "$GITHUB_OUTPUT"

      - name: Install target Java toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ steps.target.outputs.java_setup_version }}

      - name: Pin production Java
        if: steps.target.outputs.java_version == '25'
        run: |
          echo "SGS_JAVA25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "SBP_JAVA25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "STS_JAVA25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Install Java for Gradle
        if: steps.target.outputs.gradle_java_version != steps.target.outputs.java_setup_version
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ steps.target.outputs.gradle_java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6


      - name: Read pinned dependency sources
        id: content
        run: |
          set -euo pipefail
          grass="$(sed -n 's/^grass.commit=//p' gradle/content-dependencies.properties)"
          [[ "$grass" =~ ^[0-9a-f]{40}$ ]]
          echo "grass=$grass" >> "$GITHUB_OUTPUT"
          pieces="$(sed -n 's/^pieces.commit=//p' gradle/content-dependencies.properties)"
          [[ "$pieces" =~ ^[0-9a-f]{40}$ ]]
          echo "pieces=$pieces" >> "$GITHUB_OUTPUT"
      - name: Check out SkysGrassSlabs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SkyBlade1978/SkysGrassSlabs
          ref: ${{ steps.content.outputs.grass }}
          path: dependencies/grass
      - name: Check out SkysBuildingPieces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SkyBlade1978/SkysBuildingPieces
          ref: ${{ steps.content.outputs.pieces }}
          path: dependencies/pieces
      - name: Build development dependencies
        run: |
          set -euo pipefail
          (cd dependencies/grass && bash ./gradlew assemble --no-daemon --stacktrace)
          (cd dependencies/pieces && bash ./gradlew assemble --no-daemon --stacktrace)


      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Build, test, and audit release artifacts
        run: >-
          ./gradlew clean check integrationTest build javadoc verifyReleaseArtifacts writeReleaseChecksums
          verifyEclipseProductionClasspath -PgrassSlabsDirectory=dependencies/grass -PbuildingPiecesDirectory=dependencies/pieces --no-daemon --stacktrace

      - name: Replay artifact checks offline
        run: >-
          ./gradlew assemble verifyReleaseArtifacts writeReleaseChecksums -PgrassSlabsDirectory=dependencies/grass -PbuildingPiecesDirectory=dependencies/pieces --offline --no-daemon --stacktrace

      - name: Upload audited release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SkysTerrainSmoother-${{ steps.target.outputs.minecraft_version }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/libs/SkysTerrainSmoother-0.1.1.2603001.jar
            build/libs/SkysTerrainSmoother-0.1.1.2603001-sources.jar
            build/libs/SkysTerrainSmoother-0.1.1.2603001-javadoc.jar
            build/release/SHA256SUMS
            CHANGELOG.md

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SkysTerrainSmoother-${{ steps.target.outputs.minecraft_version }}-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/test-results/**
            build/reports/**
            build/*-run/logs/**
            build/*-run/**/*.properties
            build/problems/**
