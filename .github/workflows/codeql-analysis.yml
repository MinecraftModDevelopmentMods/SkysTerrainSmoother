name: CodeQL

on:
  push:
    branches:
      - 'master-*'
      - 'feature/**'
  pull_request:
    branches:
      - 'master-*'
  schedule:
    - cron: '47 7 * * 4'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read target build metadata
        id: target
        shell: bash
        run: |
          set -euo pipefail
          value() { sed -n "s/^$1=//p" gradle.properties; }
          toolchain="$(value java_toolchain_version)"
          selector="$(value java_setup_version)"
          echo "java_setup_version=${selector:-$toolchain}" >> "$GITHUB_OUTPUT"
          echo "java_version=$(value java_version)" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$(value minecraft_version)" >> "$GITHUB_OUTPUT"
          echo "gradle_java_version=${selector:-$(value gradle_java_toolchain_version)}" >> "$GITHUB_OUTPUT"
          echo "artifact_prefix=SkysTerrainSmoother-$(value mod_version)" >> "$GITHUB_OUTPUT"

      - name: Install target Java toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ steps.target.outputs.java_setup_version }}

      - name: Pin production Java
        if: steps.target.outputs.java_version == '25'
        run: |
          echo "SGS_JAVA25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "SBP_JAVA25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "STS_JAVA25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Install Java for Gradle
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ steps.target.outputs.gradle_java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6


      - name: Read pinned dependency sources
        id: content
        run: |
          set -euo pipefail
          grass="$(sed -n 's/^grass.commit=//p' gradle/content-dependencies.properties)"
          [[ "$grass" =~ ^[0-9a-f]{40}$ ]]
          echo "grass=$grass" >> "$GITHUB_OUTPUT"
          pieces="$(sed -n 's/^pieces.commit=//p' gradle/content-dependencies.properties)"
          [[ "$pieces" =~ ^[0-9a-f]{40}$ ]]
          echo "pieces=$pieces" >> "$GITHUB_OUTPUT"
      - name: Check out SkysGrassSlabs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SkyBlade1978/SkysGrassSlabs
          ref: ${{ steps.content.outputs.grass }}
          path: dependencies/grass
      - name: Check out SkysBuildingPieces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SkyBlade1978/SkysBuildingPieces
          ref: ${{ steps.content.outputs.pieces }}
          path: dependencies/pieces
      - name: Build development dependencies
        run: |
          set -euo pipefail
          chmod +x dependencies/*/gradlew
          (cd dependencies/grass && ./gradlew assemble --no-daemon --stacktrace)
          (cd dependencies/pieces && ./gradlew assemble --no-daemon --stacktrace)


      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: java-kotlin

      - name: Compile production code
        run: |
          chmod +x ./gradlew
          ./gradlew clean classes -PgrassSlabsDirectory=dependencies/grass -PbuildingPiecesDirectory=dependencies/pieces --rerun-tasks --no-daemon --stacktrace

      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
