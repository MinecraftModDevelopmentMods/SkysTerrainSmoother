// ForgeGradle invokes Mavenizer while configuring the project. Verify the
// complete five-file fixture before any Mavenizer code is allowed to run.
mavenizerFixtureChecksums.keySet().each { fixture ->
    if (!fixture.isFile()) {
        throw new GradleException("Missing Mavenizer compatibility fixture: ${fixture}")
    }
    String actual = sha256Of(fixture)
    String expected = mavenizerFixtureChecksums[fixture]
    if (actual != expected) {
        throw new GradleException("Mavenizer compatibility fixture checksum mismatch for " +
                "${fixture.name}: expected ${expected}, found ${actual}")
    }
}

