def configureEclipseBuildship = tasks.register('configureEclipseBuildship') {
    group = 'ide'
    description = 'Pins Eclipse Buildship to the Gradle home used for NeoForge.'
    doLast {
        String requestedGradleHome = System.getenv('GRADLE_USER_HOME')
        File gradleHome = requestedGradleHome == null || requestedGradleHome.trim().isEmpty()
                ? gradle.gradleUserHomeDir : file(requestedGradleHome)
        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        if (preferencesFile.isFile()) {
            preferencesFile.withInputStream { preferences.load(it) }
        }
        preferences.setProperty('eclipse.preferences.version', '1')
        preferences.setProperty('connection.gradle.distribution', 'GRADLE_DISTRIBUTION(WRAPPER)')
        preferences.setProperty('connection.gradle.user.home', gradleHome.canonicalPath)
        preferences.setProperty('connection.project.dir', '')
        preferences.setProperty('gradle.user.home', gradleHome.canonicalPath)
        preferences.setProperty('java.home', System.getProperty('java.home'))
        preferences.setProperty('override.workspace.settings', 'true')
        // Keep explicit local dependency choices through a Buildship refresh.
        List<String> arguments = preferences.getProperty('arguments', '').tokenize(' ')
        arguments.removeAll {
            it.startsWith('-PgrassSlabsDirectory=') || it.startsWith('-PgrassSlabsVersion=') ||
                    it.startsWith('-PbuildingPiecesDirectory=') ||
                    it.startsWith('-PbuildingPiecesCoreVersion=')
        }
        arguments.add('-PgrassSlabsDirectory=' + relativePath(grassSlabsDirectory))
        if (localGrassVersion.isPresent()) arguments.add('-PgrassSlabsVersion=' + grassVersion)
        arguments.add('-PbuildingPiecesDirectory=' + relativePath(buildingPiecesDirectory))
        if (localPiecesVersion.isPresent()) {
            arguments.add('-PbuildingPiecesCoreVersion=' + piecesVersion)
        }
        preferences.setProperty('arguments', arguments.join(' '))
        preferencesFile.parentFile.mkdirs()
        preferencesFile.withOutputStream { preferences.store(it,
                'Generated Buildship configuration for the NeoForge development environment.') }
    }
}

eclipse {
    project {
        natures 'org.eclipse.buildship.core.gradleprojectnature'
        buildCommand 'org.eclipse.buildship.core.gradleprojectbuilder'
    }
    classpath {
        downloadSources = true
        downloadJavadoc = true
        file.whenMerged { classpath ->
            def libraryPaths = new LinkedHashSet<String>()
            classpath.entries = classpath.entries.findAll { entry ->
                !(entry instanceof org.gradle.plugins.ide.eclipse.model.Library)
                        || libraryPaths.add(entry.path)
            }
            classpath.entries.removeAll { entry ->
                entry instanceof org.gradle.plugins.ide.eclipse.model.SourceFolder &&
                        ['src/main/resources', 'src/generated/resources'].contains(entry.path)
            }
            if (!classpath.entries.any { entry -> entry.path == 'build/resources/main' }) {
                classpath.entries.add(new org.gradle.plugins.ide.eclipse.model.SourceFolder(
                        'build/resources/main', 'bin/main'))
            }
        }
    }
    synchronizationTasks 'prepareEclipseResources'
}

tasks.named('eclipse').configure {
    dependsOn prepareEclipseResources
    dependsOn configureEclipseBuildship
    doLast {
        fileTree(file('.eclipse/configurations')) { include '**/*.launch' }.files.each { launch ->
            def model = new groovy.xml.XmlParser(false, false).parse(launch)
            if (model.@type != 'org.eclipse.jdt.launching.localJavaApplication') return
            def exclude = model.booleanAttribute.find {
                it.@key == 'org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE'
            }
            if (exclude == null) {
                model.appendNode('booleanAttribute', [
                        key: 'org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE', value: 'true'])
            } else {
                exclude.@value = 'true'
            }
            launch.setText(groovy.xml.XmlUtil.serialize(model).replace('\r\n', '\n'), 'UTF-8')
        }
    }
}

def verifyEclipseConfiguration = tasks.register('verifyEclipseConfiguration') {
    group = 'verification'
    description = 'Rejects duplicate Eclipse dependencies and production/test classpath leakage.'
    dependsOn tasks.named('eclipse')
    doLast {
        File classpathFile = file('.classpath')
        if (!classpathFile.isFile()) throw new GradleException('Eclipse .classpath was not generated')
        String classpathText = classpathFile.getText('UTF-8')
        if (!classpathText.contains('path="build/resources/main"') ||
                classpathText.contains('path="src/main/resources"') ||
                classpathText.contains('path="src/generated/resources"')) {
            throw new GradleException('Eclipse must consume only Gradle-processed production resources')
        }
        def classpath = new groovy.xml.XmlParser(false, false).parse(classpathFile)
        def entries = classpath.classpathentry
        if (entries.find { it.@kind == 'output' }.@path != 'bin/default' ||
                entries.find { it.@path == 'src/main/java' }.@output != 'bin/main' ||
                entries.find { it.@path == 'src/test/java' }.@output != 'bin/test' ||
                !classpathText.contains('/JavaSE-21/')) {
            throw new GradleException('Eclipse production, test and default output must be separate on Java 21')
        }
        List<String> libraries = entries.findAll { it.@kind == 'lib' }
                .collect { file(it.@path).canonicalPath }
        if (libraries.size() != libraries.toSet().size()) {
            throw new GradleException('Eclipse has a duplicate library path')
        }
        List<File> grassLibraries = libraries.collect { file(it) }.findAll { it.name.startsWith('SkysGrassSlabs-') }
        List<File> piecesLibraries = libraries.collect { file(it) }.findAll { it.name.startsWith('SkysBuildingPieces-') }
        if (grassLibraries != [grassSlabsDevelopmentJar.canonicalFile] ||
                piecesLibraries != [buildingPiecesDevelopmentJar.canonicalFile]) {
            throw new GradleException('Eclipse must use the same two content jars as Gradle')
        }
        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        if (!preferencesFile.isFile()) throw new GradleException('Missing Buildship preferences')
        Properties preferences = new Properties()
        preferencesFile.withInputStream { preferences.load(it) }
        if (preferences.getProperty('override.workspace.settings') != 'true') {
            throw new GradleException('Eclipse Buildship workspace override is not active')
        }
        List<String> arguments = preferences.getProperty('arguments', '').tokenize(' ')
        if (!arguments.contains('-PgrassSlabsDirectory=' + relativePath(grassSlabsDirectory)) ||
                !arguments.contains('-PbuildingPiecesDirectory=' + relativePath(buildingPiecesDirectory))) {
            throw new GradleException('Eclipse Buildship lost the selected content checkouts')
        }
        List<String> overrides = arguments.findAll { it.startsWith('-PbuildingPiecesCoreVersion=') }
        if (overrides != (localPiecesVersion.isPresent() ? ['-PbuildingPiecesCoreVersion=' + piecesVersion] : [])) {
            throw new GradleException('Eclipse Buildship retained an incorrect Building Pieces version override')
        }
        Set<File> runLaunches = fileTree(file('.eclipse/configurations')) {
            include '**/*.launch'
        }.files.findAll { launch ->
            String name = launch.name.toLowerCase(Locale.ROOT)
            name.startsWith('run ') && (name.contains('client') || name.contains('server'))
        }
        if (runLaunches.size() != 4 || runLaunches.count { it.name.toLowerCase(Locale.ROOT).contains('mineralogy') } != 2) {
            throw new GradleException('Expected isolated ordinary and Mineralogy Eclipse client/server launches')
        }
        runLaunches.each { launch ->
            String launchText = launch.getText('UTF-8')
            if (launchText.contains('neoforge.enabledGameTestNamespaces=') ||
                    launchText.contains('integration-test') || launchText.contains('src/test')) {
                throw new GradleException("${launch.name} exposes test code to a regular run")
            }
            def model = new groovy.xml.XmlParser(false, false).parse(launch)
            def exclude = model.booleanAttribute.find {
                it.@key == 'org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE'
            }
            def modSources = model.mapAttribute.mapEntry.flatten().find { it.@key == 'MOD_CLASSES' }
            String expectedOutput = file('bin/main').canonicalPath.replace('\\', '/')
            if (model.@type != 'org.eclipse.jdt.launching.localJavaApplication' ||
                    exclude?.@value != 'true' ||
                    modSources?.@value?.toString()?.replace('\\', '/') != project.name + '%%' + expectedOutput) {
                throw new GradleException("${launch.name} must use only the merged production output")
            }
        }
        File metadata = file('bin/main/META-INF/neoforge.mods.toml')
        if (!metadata.isFile() || metadata.getText('UTF-8').contains('${mod_version}') ||
                !metadata.getText('UTF-8').contains("version=\"${project.version}\"")) {
            throw new GradleException('Eclipse output contains missing or unexpanded NeoForge metadata')
        }
        List<String> forbidden = ['src/test', 'bin/test', 'build/classes/java/test',
                'net.minecraftforge', 'META-INF/mods.toml']
        fileTree(project.projectDir) { include 'run*.launch' }.files.each { launch ->
            List<String> leaked = forbidden.findAll { launch.getText('UTF-8').contains(it) }
            if (!leaked.isEmpty()) {
                throw new GradleException("${launch.name} exposes test/Forge/local content: ${leaked}")
            }
        }
    }
}




tasks.named('eclipse') { dependsOn prepareContentDevelopmentRun }
tasks.register('verifyEclipseProductionClasspath') { dependsOn verifyEclipseConfiguration }

apply from: 'gradle/recipe-advancements.gradle'
apply from: 'gradle/mineralogy-runs.gradle'

// The native probes are separate jars so neither source set can leak into ordinary games.
def addNativeProbe = { String taskName, String sources, String output, String fileName ->
    def classes = layout.buildDirectory.dir(output + '/classes')
    def compile = tasks.register('compile' + taskName, JavaCompile) {
        dependsOn tasks.named('classes')
        source fileTree('src/' + sources + '/java')
        classpath = files(sourceSets.main.output, sourceSets.main.compileClasspath)
        destinationDirectory = classes
    }
    tasks.register(taskName.uncapitalize(), Jar) {
        dependsOn compile
        archiveFileName = fileName
        destinationDirectory = layout.buildDirectory.dir(output)
        from classes
        from('src/' + sources + '/resources') { exclude 'log4j2.xml' }
    }
}
def integrationJar = addNativeProbe('IntegrationTestModJar', 'integrationTest',
        'integration-test-mod', 'skysterrainsmoother-integration-test.jar')
def bootstrapJar = addNativeProbe('NativeBootstrapProbeJar', 'bootstrapTest',
        'native-bootstrap', 'terrain-smoother-native-checks.jar')
tasks.register('preparePackagedIntegrationProbe') { dependsOn integrationJar, bootstrapJar }

def launcherClasses = tasks.register('compileNativeUnitLauncher', JavaCompile) {
    source fileTree(new File(buildingPiecesDirectory, 'src/testLauncher/java'))
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('native-unit-launcher/classes')
}
def launcher = tasks.register('nativeUnitLauncherJar', Jar) {
    dependsOn launcherClasses
    archiveFileName = 'native-unit-launcher.jar'
    destinationDirectory = layout.buildDirectory.dir('native-unit-launcher')
    from launcherClasses.flatMap { it.destinationDirectory }
    manifest.attributes('Premain-Class': 'zone.moddev.mc.skysbuildingpieces.testlaunch.NativeTestLauncher')
}
tasks.withType(Test).configureEach {
    dependsOn launcher
    doFirst { jvmArgs '-javaagent:' + launcher.get().archiveFile.get().asFile.absolutePath }
}

tasks.register('verifyNativeLogPolicy', Exec) {
    group = 'verification'
    commandLine providers.gradleProperty('pythonExecutable').getOrElse(System.getProperty('os.name').startsWith('Windows') ? 'python' : 'python3'),
            '-m', 'unittest', 'discover', '-s', 'tools'
}
tasks.named('check') { dependsOn tasks.named('verifyNativeLogPolicy') }
