    dependsOn nativePrepare
    workingDir nativeDirectory
    configureFromForgeRun(delegate, 'runServer')
    doLast {
        File log = new File(nativeDirectory.get().asFile, 'logs/latest.log')
        String result = log.isFile() ? readForgeRuntimeLog(log) : ''
        if (!result.contains('TERRAIN_NATIVE_BOOTSTRAP_PASS') || !result.contains('Done (') ||
                result =~ /(?m)\[[^\r\n]*\/(?:ERROR|FATAL)\]/ || result.contains('[STDERR/') ||
