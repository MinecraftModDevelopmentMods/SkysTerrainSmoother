            File target = familyForwardDirectory.get().asFile
            File marker = new File(target, 'world/family-forward-' + phase + '.properties')
            if (!marker.isFile() || !marker.getText('UTF-8').contains('complete=true')) {
                throw new GradleException('Forward upgrade checks did not complete: ' + phase)
            }
            project.services.get(org.gradle.process.ExecOperations).exec {
                commandLine providers.gradleProperty('pythonExecutable').getOrElse('python'),
                        'tools/native_client_log.py', '--server', '--directory', target.absolutePath, '--phase', phase
            }
            copy { from new File(target, 'logs'); into new File(target, 'phase-logs/' + phase) }
        }
    }
}
tasks.register('integrationForwardTest') {
    group = 'verification'
    description = 'Upgrades and reloads a sealed native 1.12 family world.'
    dependsOn forwardReload
}

tasks.named('check') { dependsOn tasks.named('integrationForwardTest') }

tasks.register('verifyCraftingResources', Exec) {
    group = 'verification'
    commandLine providers.gradleProperty('pythonExecutable').getOrElse('python'), 'tools/test_powder_snow_resources.py'
}
tasks.named('check') { dependsOn tasks.named('verifyCraftingResources') }
