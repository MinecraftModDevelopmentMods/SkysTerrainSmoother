def stageContentJars = { File gameDirectory ->
    File mods = new File(gameDirectory, 'mods')
    Set<String> expected = [grassSlabsDevelopmentJar.name, buildingPiecesDevelopmentJar.name] as Set<String>
    fileTree(mods).matching { include '*.jar' }.each { existing ->
        if (existing.name ==~ /Skys(?:GrassSlabs|BuildingPieces)-[0-9].*\.jar/ && !expected.contains(existing.name)) {
            throw new GradleException('An older content jar is already in the development profile: ' + existing)
        }
        if (existing.name.contains('integration-test') || existing.name.contains('native-checks')) {
            throw new GradleException('Ordinary development runs must not contain runtime probes: ' + existing)
        }
    }
    copy {
        from grassSlabsDevelopmentJar, buildingPiecesDevelopmentJar
        into mods
    }
}

