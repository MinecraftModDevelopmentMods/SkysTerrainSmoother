tasks.register('integrationTest') {
    group = 'verification'
    description = 'Runs the build-only legacy gameplay probe through fresh and reload servers.'
    dependsOn integrationReloadProcess
    doLast {
        File runDirectory = integrationRunDirectory.get().asFile
        File marker = new File(runDirectory, 'world/skysterrainsmoother-integration.properties')
        Properties values = new Properties()
        marker.withInputStream { values.load(it) }
        ['fresh_complete', 'reload_complete', 'gameplay_checks', 'generation_checks'].each { key ->
            if (!values.getProperty(key)) throw new GradleException("Missing integration evidence ${key}")
        }
        List<File> crashReports = fileTree(new File(runDirectory, 'crash-reports')).files as List<File>
        if (!crashReports.isEmpty()) {
            throw new GradleException("Integration runtime produced crash reports: ${crashReports}")
        }
        File latest = new File(runDirectory, 'logs/latest.log')
        if (!latest.isFile() || latest.text.contains('Encountered an unexpected exception')) {
            throw new GradleException("Integration runtime log is missing or contains a server failure: ${latest}")
        }
    }
}

