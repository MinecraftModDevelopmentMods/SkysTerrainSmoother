eclipse {
    classpath {
        defaultOutputDir = file('bin/default')
        downloadSources = true
        downloadJavadoc = true
        file.whenMerged { classpath ->
            // Forge supplies MixinExtras at launch. Its common jar is only needed for compilation.
            classpath.entries.removeAll { entry ->
                entry instanceof org.gradle.plugins.ide.eclipse.model.Library &&
                        file(entry.path).name.startsWith('mixinextras-common-')
            }
            // Eclipse copies these files on every build. Use Gradle's expanded metadata, never the template.
            def resources = classpath.entries.findAll {
                it instanceof org.gradle.plugins.ide.eclipse.model.SourceFolder &&
                        it.path in ['src/main/resources', 'build/resources/main']
            }
            // Keep one entry when Gradle merges an existing Eclipse classpath.
            resources.drop(1).each { classpath.entries.remove(it) }
            resources.take(1).each { entry ->
                entry.path = 'build/resources/main'
            }
        }
    }
    synchronizationTasks 'processResources', 'genEclipseRuns'
}

