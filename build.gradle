def prepareFamilyForward = tasks.register('prepareFamilyForwardFixture') {
    dependsOn integrationTestModJar, verifyContentDependencies
    doLast {
        File target = familyForwardDirectory.get().asFile
        if (new File(target, 'logs/latest.log').isFile()) {
            throw new GradleException('Archive the previous forward-upgrade evidence before preparing another run')
        }
        File fixture = file('src/test/resources/fixtures/forward-1.12.2-family')
        File archive = new File(fixture, 'world.zip')
        String expected = new File(fixture, 'SHA256SUMS').getText('UTF-8').trim().split(/\s+/)[0]
        String actual = MessageDigest.getInstance('SHA-256').digest(Files.readAllBytes(archive.toPath()))
                .encodeHex().toString().toUpperCase(Locale.ROOT)
        if (actual != expected) throw new GradleException('The sealed source world changed')
        copy { from zipTree(archive); into target }
        copy { from archive; into target; rename { 'source-world.zip' } }
        copy { from new File(fixture, 'source-family-fixture.json'); into target }
        String sourceManifestHash = MessageDigest.getInstance('SHA-256')
                .digest(new File(fixture, 'source-family-fixture.json').bytes)
                .encodeHex().toString().toUpperCase(Locale.ROOT)
        new File(target, 'source-inputs.json').setText(groovy.json.JsonOutput.toJson([
                world_sha256: expected, mode: 'server', manifest_sha256: sourceManifestHash
        ]), 'UTF-8')
        copy { from 'src/bootstrapTest/defaultconfigs'; into target }
        copy {
            from integrationTestModJar.flatMap { it.archiveFile }, grassSlabsDevelopmentJar, buildingPiecesDevelopmentJar
            into new File(target, 'mods')
        }
        new File(target, 'eula.txt').setText('eula=true\n', 'UTF-8')
        ['banned-players.json', 'banned-ips.json', 'ops.json', 'whitelist.json'].each { name ->
            new File(target, name).setText('[]\n', 'UTF-8')
        }
        new File(target, 'server.properties').setText('level-name=world\nonline-mode=false\n' +
                'server-ip=127.0.0.1\nserver-port=0\nview-distance=6\nmax-tick-time=120000\n', 'UTF-8')
    }
}
