tasks.register('verifyEclipseProductionClasspath') {
    group = 'verification'
    dependsOn tasks.named('genEclipseRuns'), tasks.named('eclipse')
    doLast {
        File prefsFile = file('.settings/org.eclipse.buildship.core.prefs')
        if (!prefsFile.isFile()) throw new GradleException('Missing Buildship preferences')
        Properties prefs = new Properties()
        prefsFile.withInputStream { prefs.load(it) }
        if (file(prefs.getProperty('connection.gradle.user.home', '')).canonicalFile != gradle.gradleUserHomeDir.canonicalFile) {
            throw new GradleException('Eclipse Buildship uses the wrong Gradle home')
        }
        List<String> arguments = prefs.getProperty('arguments', '').tokenize(' ')
        if (!arguments.contains('-PgrassSlabsDirectory=' + relativePath(grassSlabsDirectory)) ||
                !arguments.contains('-PbuildingPiecesDirectory=' + relativePath(buildingPiecesDirectory))) {
            throw new GradleException('Eclipse Buildship lost the selected content checkouts')
        }
        List<String> overrides = arguments.findAll { it.startsWith('-PbuildingPiecesCoreVersion=') }
        List<String> expectedOverrides = localPiecesVersion.isPresent() ?
                ['-PbuildingPiecesCoreVersion=' + piecesVersion] : []
        if (overrides != expectedOverrides) {
            throw new GradleException('Eclipse Buildship retained an incorrect Building Pieces version override')
        }
        File metadata = file('bin/main/META-INF/mods.toml')
        def eclipseClasspath = new groovy.xml.XmlSlurper().parse(file('.classpath'))
        def mixinExtrasLibraries = eclipseClasspath.classpathentry.findAll {
            it.@kind == 'lib' && file(it.@path.text()).name.startsWith('mixinextras-')
        }.collect { file(it.@path.text()).name }
        if (mixinExtrasLibraries.size() != 1 || !mixinExtrasLibraries.first().startsWith('mixinextras-forge-')) {
            throw new GradleException('Eclipse must use the MixinExtras runtime supplied by Forge')
        }
        def piecesLibraries = eclipseClasspath.classpathentry.findAll {
            it.@kind == 'lib' && it.@path.text().tokenize('/\\').last().startsWith('SkysBuildingPieces-')
        }*.@path*.text().collect { file(it).canonicalFile }
        if (piecesLibraries != [buildingPiecesDevelopmentJar.canonicalFile]) {
            throw new GradleException('Eclipse must use only the selected Building Pieces development jar')
        }
        def grassLibraries = eclipseClasspath.classpathentry.findAll {
            it.@kind == 'lib' && it.@path.text().tokenize('/\\').last().startsWith('SkysGrassSlabs-')
        }*.@path*.text().collect { file(it).canonicalFile }
        if (grassLibraries != [grassSlabsDevelopmentJar.canonicalFile]) {
            throw new GradleException('Eclipse must use only the pinned Grass Slabs development jar')
        }
        def resourceFolders = eclipseClasspath.classpathentry.findAll { it.@kind == 'src' }*.@path*.text()
        if (resourceFolders.contains('src/main/resources') ||
                resourceFolders.count { it == 'build/resources/main' } != 1) {
            throw new GradleException('Eclipse must copy processed resources, not overwrite them with templates')
        }
        String nativeMetadata = metadata.isFile() ? metadata.getText('UTF-8') : ''
        if (!nativeMetadata.contains("version=\"${project.mod_version}\"") ||
                !nativeMetadata.contains("versionRange=\"${project.minecraft_version_range}\"")) {
            throw new GradleException('Eclipse output contains incorrect mods.toml')
        }
        ['runClient.launch', 'runServer.launch', 'runTestClient.launch', 'runTestServer.launch'].each { name ->
            String contents = file(name).getText('UTF-8')
            if (contents.contains('${MC_VERSION}')) {
                throw new GradleException("${name} retains ForgeGradle's unresolved MC_VERSION token")
            }
            if (!contents.contains('--main net.minecraftforge.bootstrap.ForgeBootstrap') ||
                    !contents.contains("forge-${project.minecraft_version}-${project.forge_version}-metadata.zip")) {
                throw new GradleException("${name} must use the native launcher and Minecraft ${project.minecraft_version}")
            }
            if (contents.contains('--to-srg') || contents.contains('--to-obf')) {
                throw new GradleException("${name} requests remapping on an official-name runtime")
            }
        }
        ['runClient.launch', 'runServer.launch'].each { name ->
            String contents = file(name).getText('UTF-8').replace('\\', '/')
            if (!contents.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE') ||
                    contents.contains('src/test') || contents.contains('bin/test') || contents.contains('junit-')) {
                throw new GradleException("${name} exposes test code or dependencies")
            }
            def xml = new groovy.xml.XmlParser(false, false).parse(file(name))
            String modClasses = xml.mapAttribute.find {
                it.@key == 'org.eclipse.debug.core.environmentVariables'
            }.mapEntry.find { it.@key == 'MOD_CLASSES' }.@value
            List<String> roots = modClasses.split(java.util.regex.Pattern.quote(File.pathSeparator)).toList()
            if (roots.size() != 1 ||
                    roots[0].replace('\\', '/') != "${mod_id}%%${projectDir}/bin/main".replace('\\', '/')) {
                throw new GradleException("${name} must have one merged production output in MOD_CLASSES")
            }
        }
    }
}

