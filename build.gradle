def verifyContentDependencies = tasks.register('verifyContentDependencies') {
    doLast {
        Map dependencies = [
                grass: [directory: grassSlabsDirectory, version: grassVersion,
                        override: localGrassVersion.isPresent(), artifact: 'SkysGrassSlabs'],
                pieces: [directory: buildingPiecesDirectory, version: piecesVersion,
                         override: localPiecesVersion.isPresent(), artifact: 'SkysBuildingPieces']
        ]
        dependencies.each { name, selected ->
            File directory = selected.directory
            Properties metadata = new Properties()
            new File(directory, 'gradle.properties').withInputStream { metadata.load(it) }
            if (metadata.mod_version != selected.version) {
                throw new GradleException("Content dependency version does not match its lock: ${name}" +
                        " (expected ${selected.version}, found ${metadata.mod_version}).")
            }
            if (!selected.override) {
                Process revision = new ProcessBuilder('git', '-C', directory.path, 'rev-parse', 'HEAD').start()
                String commit = revision.inputStream.getText('UTF-8').trim()
                if (revision.waitFor() != 0 || commit != contentLock.getProperty(name + '.commit')) {
                    throw new GradleException('Content dependency source does not match its lock: ' + name)
                }
                Process status = new ProcessBuilder('git', '-C', directory.path,
                        'status', '--porcelain', '--untracked-files=no').start()
                String changes = status.inputStream.getText('UTF-8').trim()
                if (status.waitFor() != 0 || !changes.isEmpty()) {
                    throw new GradleException('The pinned content checkout has tracked changes: ' + name)
                }
                [
                        [path: "build/libs/${selected.artifact}-${selected.version}.jar", key: '.sha256'],
                        [path: "build/libs/${selected.artifact}-${selected.version}.jar", key: '.development.sha256']
                ].each { artifact ->
                    File jar = new File(directory, artifact.path)
                    if (!jar.isFile()) {
                        throw new GradleException('Build the pinned content dependency first: ' + jar)
                    }
                    String checksum = MessageDigest.getInstance('SHA-256').digest(Files.readAllBytes(jar.toPath()))
                            .encodeHex().toString().toUpperCase(Locale.ROOT)
                    if (checksum != contentLock.getProperty(name + artifact.key)) {
                        throw new GradleException('Content dependency artifact does not match its lock: ' + jar.name)
                    }
                }
            }
        }
    }
}

