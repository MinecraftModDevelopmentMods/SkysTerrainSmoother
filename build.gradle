def contentLock=new Properties()
file('gradle/content-dependencies.properties').withInputStream { contentLock.load(it) }
def verifyContentDependencies=tasks.register('verifyContentDependencies') {
    doLast {
        [grass:grassSlabsDirectory,pieces:buildingPiecesDirectory].each { name,directory ->
            Properties metadata=new Properties()
            new File(directory,'gradle.properties').withInputStream { metadata.load(it) }
            if(metadata.mod_version!=contentLock.getProperty(name+'.version'))
                throw new GradleException('Content dependency version does not match its lock: '+name)
            if(System.getenv('CI')!=null) {
                Process git=new ProcessBuilder('git','-C',directory.path,'rev-parse','HEAD').start()
                String sha=git.inputStream.getText('UTF-8').trim()
                if(git.waitFor()!=0||sha!=contentLock.getProperty(name+'.commit'))
                    throw new GradleException('Content dependency source does not match its lock: '+name)
            }
        }
    }
}

tasks.named('compileJava') {
    dependsOn verifyContentDependencies
    doFirst {
