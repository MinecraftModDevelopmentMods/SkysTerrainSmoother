// Keep language files intact when archive filters run on another operating system.
def verifyLanguageArchives = tasks.register('verifyLanguageArchives') {
    group = 'verification'
    dependsOn tasks.named('assemble')
    inputs.files(fileTree("src/main/resources/assets/${project.mod_id}/lang") {
        include '*.json'
    })
    doLast {
        File artifact = layout.buildDirectory.file(
                "libs/${base.archivesName.get()}-${project.version}.jar").get().asFile
        new java.util.zip.ZipFile(artifact).withCloseable { archive ->
            fileTree("src/main/resources/assets/${project.mod_id}/lang").matching {
                include '*.json'
            }.each { source ->
                String entryName = "assets/${project.mod_id}/lang/${source.name}"
                def entry = archive.getEntry(entryName)
                if (entry == null) {
                    throw new GradleException("Packaged translation is missing: ${entryName}")
                }
                byte[] expected = source.getText('UTF-8').replace('\r\n', '\n').getBytes('UTF-8')
                byte[] actual = archive.getInputStream(entry).withCloseable { it.readAllBytes() }
                if (!java.util.Arrays.equals(expected, actual)) {
                    throw new GradleException("Packaged translation differs from its UTF-8 source: ${entryName}")
                }
            }
        }
    }
}

tasks.named('verifyReleaseArtifacts') {
    dependsOn verifyLanguageArchives
}
