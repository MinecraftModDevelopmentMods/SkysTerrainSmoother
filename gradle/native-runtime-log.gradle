// The empty Forge 65 server reproduces this Windows report without any mods.
// Keep it out of the build-only audit, and leave the raw logs in place.
ext.readForgeRuntimeLog = { File log ->
    if (project.forge_version != '65.1.0' ||
            !System.getProperty('os.name').startsWith('Windows')) {
        return log.getText('UTF-8')
    }

    def python = providers.gradleProperty('pythonExecutable').getOrElse('python')
    return providers.exec {
        commandLine python, file('tools/native_windows_log.py'), log
        environment 'PYTHONIOENCODING', 'utf-8'
    }.standardOutput.asText.get()
}
